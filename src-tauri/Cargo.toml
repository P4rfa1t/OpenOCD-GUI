[package]
name = "openocd-gui"
version = "0.2.1"
edition = "2021"
description = "OpenOCD-GUI — a Tauri 2 front-end for OpenOCD"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
