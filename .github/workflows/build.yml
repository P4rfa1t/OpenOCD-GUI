name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    name: Windows (x86_64-msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build
        working-directory: src-tauri
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Verify WebView2Loader is statically linked
        shell: pwsh
        run: |
          $exe = "src-tauri/target/x86_64-pc-windows-msvc/release/openocd-gui.exe"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          $bytes = [IO.File]::ReadAllBytes($exe)
          $text = [Text.Encoding]::ASCII.GetString($bytes)
          if ($text.Contains("WebView2Loader.dll")) {
            throw "exe still imports WebView2Loader.dll - static link failed"
          }
          Write-Host "OK: no WebView2Loader.dll import, size $($bytes.Length) bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: OpenOCD-GUI-windows-x86_64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/openocd-gui.exe
          if-no-files-found: error

  linux:
    name: Linux (x86_64-gnu)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build
        working-directory: src-tauri
        run: cargo build --release
      - name: Verify
        run: |
          file src-tauri/target/release/openocd-gui
          ldd src-tauri/target/release/openocd-gui | head -30
      - uses: actions/upload-artifact@v4
        with:
          name: OpenOCD-GUI-linux-x86_64
          path: src-tauri/target/release/openocd-gui
          if-no-files-found: error
      - name: Bundle .deb / .AppImage (best effort)
        continue-on-error: true
        run: |
          cargo install tauri-cli --version "^2" --locked
          cd src-tauri && cargo tauri build
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: OpenOCD-GUI-linux-bundles
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

  macos:
    name: macOS (aarch64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build
        working-directory: src-tauri
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: OpenOCD-GUI-macos-aarch64
          path: src-tauri/target/release/openocd-gui
          if-no-files-found: error
